<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>বাংলা অ্যাপ স্টোর</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        header { background: #333; color: white; padding: 15px; text-align: center; border-radius: 5px; }
        .app-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 20px; }
        .app-card { background: #fff; padding: 15px; width: 250px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); text-align: center; }
        .app-card img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
        .btn-download { display: inline-block; margin-top: 10px; padding: 8px 15px; background: #28a745; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <h2>আমাদের অ্যাপ স্টোর</h2>
    </header>

    <div class="app-grid" id="app-container">
        <p>অ্যাপস লোড হচ্ছে...</p>
    </div>

    <script>
        // আপনার গিটহাবের raw ফাইলের লিংকটি এখানে বসিয়ে দিন
        const jsonUrl = "https://raw.githubusercontent.com/আপনার_ইউজারনেম/আপনার_রিপোজিটরি/main/apps.json";

        fetch(jsonUrl)
            .then(res => res.json())
            .then(apps => {
                const container = document.getElementById('app-container');
                container.innerHTML = "";
                
                if (!apps || apps.length === 0) {
                    container.innerHTML = "<p>বর্তমানে কোনো অ্যাপ নেই।</p>";
                    return;
                }

                apps.forEach(app => {
                    const card = document.createElement('div');
                    card.className = 'app-card';
                    card.innerHTML = `
                        <img src="${app.icon}" alt="Icon">
                        <h3>${app.title}</h3>
                        <p style="font-size: 13px; color: #555;">${app.description}</p>
                        <a href="${app.link}" class="btn-download" target="_blank">ডাউনলোড করুন</a>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(() => {
                document.getElementById('app-container').innerHTML = "<p>অ্যাপ লোড করতে সমস্যা হয়েছে।</p>";
            });
    </script>

</body>
</html>
